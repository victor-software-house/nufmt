%YAML 1.2
---
schema: 2
downstream:
  remote: origin
  branch: downstream
  recovery_tag_prefix: forkctl/recovery
  publish: append
upstream:
  remote: upstream
  url: https://github.com/nushell/nufmt.git
  fetch_ref: refs/heads/main
base:
  target:
    type: commit
    selector: 13f2f8c3873ae73ba7e95e5e8fd4bdac6c019f5f
    commit: 13f2f8c3873ae73ba7e95e5e8fd4bdac6c019f5f
  canonical: 13f2f8c3873ae73ba7e95e5e8fd4bdac6c019f5f
  stack: 13f2f8c3873ae73ba7e95e5e8fd4bdac6c019f5f
documents:
  ledger: PATCHES.md
  exports: patches/downstream
bookkeeping_patch: fork-tooling
patches:
  - name: vsh-release
    layer: tooling
    purpose: >-
      Version the fork release as 0.1.7-vsh.1, a build of upstream main with
      nushell/nufmt#250, and point the cargo-dist installers at the fork releases.
    upstream_status: "inappropriate: downstream-only release metadata"
    drop_when: >-
      Upstream nufmt releases a version that contains
      13f2f8c3873ae73ba7e95e5e8fd4bdac6c019f5f.
    scope:
      - Cargo.toml
      - Cargo.lock
  - name: fork-tooling
    layer: tooling
    purpose: Own fork policy, generated evidence, and integration configuration.
    upstream_status: "inappropriate: downstream-only fork maintenance"
    drop_when: The downstream fork is retired.
    scope:
      - patches/fork.yaml
      - PATCHES.md
      - patches/downstream/**
      - mise.toml
      - mise*.lock
disabled_patches: []
history: []
contracts:
  allow_base: []
